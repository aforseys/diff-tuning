# @package _global_
# maze_sparse_ebm.yaml with IRED's model-adaptive negative instead of the fixed over-noised one.
# The ONLY differences from that file are neg_eps_weight, hard_negative and the job-name suffix,
# so pairing this against the existing maze_sparse_ebm run isolates the negative construction.
#
# Why: collision rate on the sparse maze is ~10x the plain DP's even at num_inference_steps=100
# (no striding, so discretization is eliminated), while the denoising loss matches the DP's and
# keeps falling through 200k. That loss is only ever evaluated on noised REAL trajectories, so it
# says nothing about the field where sampling actually travels. The fixed eps * neg_eps_weight
# negative perturbs in one data-independent direction (over-noised, inflated norm) and the model
# solves it immediately -- loss_energy sits near 5e-4, i.e. E_pos - E_neg ~ -7.6, where the
# sigmoid has saturated and the term contributes almost no gradient. That also explains why
# setting energy_landscape_loss_weight 0.0 changed nothing. IRED's negative instead descends the
# CURRENT energy to find where the model wrongly scores low, which should put the margin near 0
# and the gradient back in play at the same 0.5 weight.

seed: 100000
dataset_repo_id: maze2d
condition_type: conditional
env_type: sparse
dataset_root: 'data/maze2d-sparse-v3.hdf5'

wandb:
  enable: true
  project: maze-base-models

hydra:
  run:
    # Set `dir` to where you would like to save all of the run outputs. If you run another training session
    # with the same value for `dir` its contents will be overwritten unless you set `resume` to true.
    dir: data/maze2d_dp/sparse/gc/train/${now:%Y.%m.%d}/${hydra.job.name}
  job:
    name: ${now:%H.%M.%S}_${env.name}_${policy.name}_hardneg

device: "cuda"  # cpu

training:
  offline_steps: 100000
  online_steps: 0
  eval_freq: 5000
  save_freq: 5000
  log_freq: 500
  save_checkpoint: true

  batch_size: 256
  grad_clip_norm: 10
  lr: 1.0e-4
  lr_scheduler: cosine
  lr_warmup_steps: 500
  adam_betas: [0.95, 0.999]
  adam_eps: 1.0e-8
  adam_weight_decay: 1.0e-6
  online_steps_between_rollouts: 1

  delta_timestamps:
    observation.environment_state: "[i / ${fps} for i in range(1 - ${policy.n_obs_steps}, 1)]"
    observation.state: "[i / ${fps} for i in range(1 - ${policy.n_obs_steps}, 1)]"
    action: "[i / ${fps} for i in range(1 - ${policy.n_obs_steps}, 1 - ${policy.n_obs_steps} + ${policy.horizon})]"
    episode_goal: "[0]"

  goal_horizon: 64

  # The original implementation doesn't sample frames for the last 7 steps,
  # which avoids excessive padding and leads to improved training results.
  drop_n_last_frames: 7  # deliberately 7, NOT horizon - n_action_steps - n_obs_steps + 1 (= 55 here); frames nearer the episode end are still sampled and rely on the action padding mask

eval:
  n_samples: 32     # trajectory samples per starting observation
  opt_params: []    # base-model eval is DDIM only; pass IRED params to eval.py when you want them
  goal: null
  metrics: [collision_rate, obs_goal_dist]
  methods: ['ddim']
  train_obs: data/maze_obs/set_obs_gc_40_min5_max7_seed0_20260430_031349_train
  test_obs: data/maze_obs/set_obs_gc_40_min5_max7_seed0_20260430_031349_test

policy:
  name: ebm_diffusion

  # Input / output structure.
  n_obs_steps: 2
  horizon: 64
  n_action_steps: 8

  input_shapes:
    observation.environment_state: [2]
    observation.state: ["${env.state_dim}"]
    episode_goal: [2]
  output_shapes:
    action: ["${env.action_dim}"]

  # Normalization / Unnormalization
  input_normalization_modes:
    observation.environment_state: min_max
    observation.state: min_max
    episode_goal: min_max
  output_normalization_modes:
    action: min_max

  # Architecture / modeling.
  # Vision backbone.
  vision_backbone: resnet18
  crop_shape: [84, 84]
  crop_is_random: True
  pretrained_backbone_weights: null
  use_group_norm: True
  spatial_softmax_num_keypoints: 32
  # Unet.
  down_dims: [128, 256, 512]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  use_film_scale_modulation: True
  # Noise scheduler.
  noise_scheduler_type: DDIM
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon # epsilon / sample
  clip_sample: True
  clip_sample_range: 1.0

  # Inference
  num_inference_steps: 10  # if not provided, defaults to `num_train_timesteps`

  # Loss computation
  do_mask_loss_for_padding: True

  gradient_loss_weight: 1

  # Energy-landscape supervision (EBMDiffusionModel._auxiliary_loss). Same weight as the paired
  # maze_sparse_ebm run; only the negative differs.
  supervise_energy_landscape: True
  energy_landscape_loss_weight: 0.5

  # IRED's model-adaptive negative instead of the fixed over-noised one. The descent itself has no
  # knobs -- it is pinned to IRED's continuous-dataset settings (2 steps at gradient scales 1.0
  # then 2.0). 3.0 is IRED's noise multiplier; the default elsewhere is 2.0, and hard_negative
  # defaults to false, so no existing config changes behavior.
  neg_eps_weight: 3.0
  hard_negative: true

  finetune_energy_landscape: false
  finetune_loss_weight: 0
