# @package _global_
# R6: the plain DP distilled into the plain DP -- no energy constraint at all. The ceiling: the
# target is exactly realizable in this architecture, so cos -> ~1 is expected, and it separates the
# curl-free constraint from ordinary extrapolation difficulty at rollout states. energy_mode is
# ignored here; policy.name is 'diffusion', so there is no EBMWrapper.
#
# Inherits everything from maze/pretrain/maze_sparse -- 100k steps, lr 1e-4 cosine with 500-step warmup, batch 256,
# save_freq/eval_freq 5000, horizon 64, num_inference_steps 10. Only the keys below differ, so
# the arms stay comparable by construction. See scripts/supercloud_scripts/maze_distill.sh.
defaults:
  - /policy/maze/pretrain/maze_sparse
  - _self_

config_name: null   # filled by run_job.py

hydra:
  run:
    dir: data/maze2d_dp/sparse/gc/distill/${now:%Y.%m.%d}/${hydra.job.name}
  job:
    name: ${now:%H.%M.%S}_${env.name}_r6_unconstrained_scratch_rollout

wandb:
  project: maze-distill

eval:
  # Per-timestep field match against the teacher, logged beside the rollout metrics.
  field_match: data/maze2d-sparse-v3.hdf5

teacher_policy_path: 'data/maze2d_dp/sparse/gc/train/dp_sparse_gc/pretrained_model'
init_from_teacher: false

policy:
  distill_sampler: teacher_rollout
  distill_target: teacher_eps

training:
  # Not set by the inherited config, so it would default to 3 (configs/default.yaml). The LLsub
  # triple must cover 1 main + this many workers: [3,2,9].
  num_workers: 8
