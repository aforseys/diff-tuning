# @package _global_
# Parameter sweep for energy-based preference finetuning on the EBM, with the preference pairs
# pooled as the base dataset (no separate base samples). Expand with:
#   python scripts/generate_configs.py --config configs/policy/gmm_param_tuning/energy_ebm_pref_only/sweep_1.yaml \
#       --out_dir configs/policy/gmm_param_tuning/energy_ebm_pref_only/sweep_1/
# 5 lr x 2 batch_size x 2 train_only_FiLM x 4 offline_steps x 5 finetune_loss_weight = 400 runs.
# finetune_loss_weight is the preference term's weight relative to the MSE anchor
# (gradient_loss_weight 1), spanning roughly the DPO_forward sweep's mu range (0.1-10 here vs 0.05-10).
sweep:
  training:
    offline_steps: [100, 300, 500, 1000]
    lr: [1.0e-3, 1.0e-4, 1.0e-5, 1.0e-6, 1.0e-7]
    batch_size: [32, 64]      # only 100 preference pairs, so keep this under 100
    train_only_FiLM: [true, false]
  policy:
    finetune_loss_weight: [0.1, 1, 2, 5, 10]

seed: 100000
dataset_repo_id: gmm
condition_type: unconditional
# No 'base' entry: the preference winners and losers are pooled into the base dataset,
# so the denoising anchor uses only the finetuning samples.
dataset_root:
  pos: 'data/gmm_obs/gmm_cluster_line_diagonal_any_100_1_unconditional_pos.npy'
  neg: 'data/gmm_obs/gmm_cluster_line_diagonal_any_100_1_unconditional_neg.npy'
pretrained_policy_path: 'data/gmm/general/train/2026.09.18/gmm_2026.09.18.13.50.05_gmm_ebm_diffusion/checkpoints/last/pretrained_model'

env:
  gmm_spec: cluster_line

wandb:
  enable: true
  project: gmm-energy-ebm-pt-dmse

config_name: ???  # Set at runtime by run_job.py

hydra:
  run:
    # Set `dir` to where you would like to save all of the run outputs. If you run another training session
    # with the same value for `dir` its contents will be overwritten unless you set `resume` to true.
    dir: data/gmm/general/tune/energy_ebm_pref_only_sweep_1/${now:%Y.%m.%d}/${hydra.job.name}
  job:
    name: gmm_unconditional_tune_energy_ebm_pref_only_sweep_1_${now:%Y.%m.%d.%H.%M.%S}_${env.name}_${config_name}_${policy.name}

device: "cuda"  # cpu

training:
  online_steps: 0
  eval_freq: 100
  log_freq: 100
  save_freq: 100
  save_checkpoint: false
  grad_clip_norm: 10
  lr_scheduler: cosine
  lr_warmup_steps: 50
  adam_betas: [0.95, 0.999]
  adam_eps: 1.0e-8
  adam_weight_decay: 1.0e-6
  online_steps_between_rollouts: 1

  delta_timestamps:
    observation.environment_state: "[0]"
    observation.state: "[0]"
    action: "[0]"

  drop_n_last_frames: false

eval:
  n_samples: 200
  opt_params: [{'n_opt': 1, 't_subset': 5, 'denoise': True}]
  methods: ['ired', 'ddim']
  utility: diagonal
  pref_test_set: 'data/gmm_obs/gmm_cluster_line_unconditional_200_2_20260930_094128.npy'
  tie_tol: 0.2

policy:
  name: ebm_diffusion

  # Input / output structure.
  n_obs_steps: 1
  horizon: 1
  n_action_steps: 1

  input_shapes:
    observation.environment_state: [1]
    observation.state: ["${env.state_dim}"]
  output_shapes:
    action: ["${env.action_dim}"]

  # Normalization / Unnormalization
  input_normalization_modes:
    observation.environment_state: min_max
    observation.state: min_max
  output_normalization_modes:
    action: min_max

  # Architecture / modeling.
  # Vision backbone.
  vision_backbone: resnet18
  crop_shape: [84, 84]
  crop_is_random: True
  pretrained_backbone_weights: null
  use_group_norm: True
  spatial_softmax_num_keypoints: 32
  # Unet.
  down_dims: [128, 256, 512]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  use_film_scale_modulation: True
  # Noise scheduler.
  noise_scheduler_type: DDIM
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon # epsilon / sample
  clip_sample: True
  clip_sample_range: 1.0

  # Inference
  num_inference_steps: 10  # if not provided, defaults to `num_train_timesteps`

  # Loss computation
  do_mask_loss_for_padding: false

  gradient_loss_weight: 1.0

  supervise_energy_landscape: false
  energy_landscape_loss_weight: 0.0

  finetune_energy_landscape: true
  finetune_loss_weight: 5.0  # overridden by the sweep

  finetune_demos: false
  demo_finetune_loss_weight: 0.0

  finetune_dpo: false
  finetune_dpo_forward_kl: false
